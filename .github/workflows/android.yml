name: Android APK Build

on:
  push:
    branches: [master]
    paths:
      - 'apps/member-mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: apps/member-mobile
        run: flutter pub get

      - name: Build APK (debug)
        working-directory: apps/member-mobile
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mettlo-android-${{ github.run_number }}
          path: apps/member-mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
