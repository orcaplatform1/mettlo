name: Android APK Build

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/member-mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Deploy APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: apps/member-mobile
        run: flutter pub get

      - name: Build APK (release)
        working-directory: apps/member-mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mettlo-android-${{ github.run_number }}
          path: apps/member-mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Copy APK to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: apps/member-mobile/build/app/outputs/flutter-apk/app-release.apk
          target: /var/www/mettlo.tr/apps/member-web/public/
          strip_components: 6
          overwrite: true

      - name: Rename APK on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mv -f /var/www/mettlo.tr/apps/member-web/public/app-release.apk \
                   /var/www/mettlo.tr/apps/member-web/public/mettlo.apk
