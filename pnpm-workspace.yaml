packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  # Flutter mobil uygulama (pubspec.yaml ile yönetilir); pnpm workspace dışındadır.
  - "!apps/member-mobile"
  # React Native mobil uygulama (bağımlılıkları kendi node_modules ile yönetilir; Expo SDK bağımlılığı çakışmasını önlemek için workspace dışındadır)
  - "!apps/member-mobile-rn"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  argon2: true
  "@nestjs/core": true
  unrs-resolver: true
  '@firebase/util': true
  protobufjs: true
minimumReleaseAgeExclude:
  - lucide-react@1.48.0
